<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>태그 달기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1F4FD1}a:hover{color:#163A9C}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #E2E6DF; color: #16191D; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif; position: relative; overflow: hidden">

  <svg width="390" height="320" viewBox="0 0 390 320" aria-hidden="true" style="position: absolute; left: 0; top: 0; display: block">
    <path d="M0 120 L 390 100 M0 210 L 390 196 M120 0 L 110 320 M260 0 L 275 320" stroke="#F4F5F2" stroke-width="10" fill="none"></path>
    <path d="M60 0 L 50 320 M0 60 L 390 50 M190 0 L 195 320 M330 0 L 340 320" stroke="#F4F5F2" stroke-width="4" fill="none"></path>
    <rect x="150" y="128" width="70" height="52" rx="3" fill="#D3D8CF"></rect>
    <rect x="232" y="132" width="24" height="44" rx="3" fill="#D3D8CF"></rect>
    <circle cx="192" cy="156" r="60" fill="#1F4FD1" opacity="0.08" stroke="#1F4FD1" stroke-opacity="0.35" stroke-dasharray="3 5"></circle>
    <circle cx="192" cy="156" r="9" fill="#FFFFFF" stroke="#16191D" stroke-width="3.5"></circle>
    <text x="254" y="226" font-family="IBM Plex Mono, monospace" font-size="10" fill="#5A6168">반경 60m</text>
  </svg>
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 320px; background: rgba(22, 25, 29, 0.18)"></div>

  <a href="Inbox.dc.html" aria-label="닫기" style="position: absolute; left: 16px; top: 54px; width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: grid; place-items: center; color: #16191D">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 4l10 10M14 4 4 14"></path></svg>
  </a>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; top: 270px; box-sizing: border-box; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 10px 20px 30px; display: flex; flex-direction: column; gap: 16px">
    <div style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #D5D9D3"></div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 700">소원로 1가 12</h1>
      <span style="font-size: 13px; color: #5A6168">이름 없는 장소 · 방문 <b style="font-family: 'Barlow Condensed', sans-serif; font-size: 16px; color: #16191D">23</b>번 · 평일 12시대 · 평균 42분</span>
    </div>

    <div style="background: #EEF0EC; border-radius: 12px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start">
      <span style="flex-shrink: 0; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #1F4FD1; border: 1px solid #1F4FD1; border-radius: 4px; padding: 0 5px; line-height: 18px; margin-top: 1px">AI</span>
      <span style="font-size: 13px; line-height: 1.55; color: #3D444B">태그를 비워 뒀어요. 한 건물에 식당과 사무실이 함께 있어서 일곱 개 태그 중 하나로 정하지 못했어요.</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 600; color: #5A6168">어떤 곳인가요?</span>
      <div role="radiogroup" aria-label="태그" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{tags}}" as="t" hint-placeholder-count="7">
          <button role="radio" aria-checked="{{t.checked}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
      <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
        <div role="status" style="background: #16191D; color: #FFFFFF; border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.5">'{{selected}}'로 태그했어요. 방문 23번에 모두 적용했고, AI는 이 장소의 태그를 바꾸지 않아요.</div>
      </sc-if>
      <span style="font-size: 12px; color: #5A6168">이 장소의 지난 방문과 앞으로의 방문 모두에 적용돼요.</span>
      <button onClick="{{apply}}" style="{{applyStyle}}">{{applyLabel}}</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { selected: null, done: false };
  }
  renderVals() {
    const base = "height: 48px; border-radius: 12px; font-family: 'IBM Plex Sans KR', sans-serif; font-size: 15px; cursor: pointer;";
    const tags = ['집', '회사', '밥집', '커피', '운동', '쇼핑', '관광'].map((label) => {
      const on = this.state.selected === label;
      return {
        label,
        checked: on ? 'true' : 'false',
        style: base + (on ? ' background: #16191D; color: #FFFFFF; border: 1.5px solid #16191D; font-weight: 700;' : ' background: #FFFFFF; color: #16191D; border: 1px solid #C9CEC6; font-weight: 500;'),
        pick: () => this.setState({ selected: label, done: false }),
      };
    });
    const sel = this.state.selected;
    const btnBase = "height: 54px; border-radius: 14px; border: none; font-family: 'IBM Plex Sans KR', sans-serif; font-size: 16px; font-weight: 600;";
    return {
      tags,
      selected: sel,
      done: this.state.done,
      applyLabel: sel ? `'${sel}' 태그 달기` : '태그를 골라 주세요',
      applyStyle: btnBase + (sel ? ' background: #1F4FD1; color: #FFFFFF; cursor: pointer;' : ' background: #E6E9E4; color: #5A6168; cursor: default;'),
      apply: () => { if (sel) this.setState({ done: true }); },
    };
  }
}
</script>
</body>
</html>
