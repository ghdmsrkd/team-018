<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>여행 재생</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@500&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1F4FD1}a:hover{color:#163A9C}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #E2E6DF; color: #16191D; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', sans-serif; position: relative; overflow: hidden">

  <svg width="390" height="560" viewBox="0 0 390 560" aria-hidden="true" style="position: absolute; left: 0; top: 0; display: block">
    <path d="M262 0 C 280 80, 286 130, 298 170 S 318 300, 332 350 S 360 470, 382 560 L 390 560 L 390 0 Z" fill="#C6D5E0"></path>
    <path d="M190 90 C 215 130, 225 200, 250 250 S 270 360, 285 420" stroke="#D3D8CF" stroke-width="10" fill="none" stroke-linecap="round"></path>
    <path d="M170 110 C 195 150, 205 220, 228 270 S 248 370, 262 430" stroke="#D9DDD5" stroke-width="5" fill="none" stroke-linecap="round"></path>
    <path d="M0 330 C 30 320, 60 340, 90 326" stroke="#C6D5E0" stroke-width="10" fill="none"></path>
    <path d="M292 152 C 230 140, 150 200, 56 302" stroke="#8A939B" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round" fill="none"></path>
    <path d="M56 302 C 120 296, 200 344, 318 340 C 314 270, 302 210, 292 160" stroke="#1F4FD1" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
    <circle cx="56" cy="302" r="8" fill="#FFFFFF" stroke="#16191D" stroke-width="3.5"></circle>
    <circle cx="318" cy="340" r="8" fill="#FFFFFF" stroke="#1F4FD1" stroke-width="3.5"></circle>
    <circle cx="296" cy="176" r="5.5" fill="#FFFFFF" stroke="#1F4FD1" stroke-width="3"></circle>
    <circle cx="292" cy="154" r="22" fill="#E86A10" opacity="0.18"></circle>
    <circle cx="292" cy="154" r="9" fill="#E86A10" stroke="#FFFFFF" stroke-width="3"></circle>
    <text x="40" y="330" font-family="IBM Plex Sans KR, sans-serif" font-size="13" font-weight="700" fill="#16191D">서울</text>
    <text x="276" y="368" font-family="IBM Plex Sans KR, sans-serif" font-size="13" font-weight="700" fill="#16191D">강릉</text>
    <text x="304" y="196" font-family="IBM Plex Sans KR, sans-serif" font-size="12" fill="#3D444B">중앙시장</text>
    <text x="336" y="470" font-family="IBM Plex Mono, monospace" font-size="10" fill="#4F6B80">동해</text>
    <text x="196" y="300" font-family="IBM Plex Mono, monospace" font-size="9" fill="#6D756C" transform="rotate(62 196 300)">태백산맥</text>
  </svg>

  <div style="position: absolute; left: 16px; right: 16px; top: 54px; display: flex; justify-content: space-between; align-items: center">
    <a href="Chat.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; display: grid; place-items: center; color: #16191D; box-shadow: 0 1px 2px rgba(22,25,29,0.12)">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6"></path></svg>
    </a>
    <div style="background: #FFFFFF; border-radius: 22px; height: 44px; padding: 0 16px; display: flex; align-items: center; gap: 8px; box-shadow: 0 1px 2px rgba(22,25,29,0.12)">
      <span style="font-size: 14px; font-weight: 700">강릉·속초 2박 3일</span>
    </div>
    <button aria-label="공유" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #FFFFFF; display: grid; place-items: center; color: #16191D; cursor: pointer; box-shadow: 0 1px 2px rgba(22,25,29,0.12)">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M10 13V3M6 7l4-4 4 4M4 11v5h12v-5"></path></svg>
    </button>
  </div>

  <div style="position: absolute; left: 118px; top: 104px; background: #16191D; color: #FFFFFF; border-radius: 12px; padding: 8px 12px; display: flex; flex-direction: column; gap: 1px">
    <span style="font-size: 14px; font-weight: 600">영금정 · 속초</span>
    <span style="font-size: 12px; color: #C3C9CE">관광 · 14:05부터 머무는 중</span>
  </div>
  <div style="position: absolute; left: 262px; top: 130px; width: 0; height: 0; border-top: 7px solid #16191D; border-left: 7px solid transparent; border-right: 7px solid transparent"></div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 312px; box-sizing: border-box; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 22px 20px 30px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 -1px 0 #D5D9D3">

    <div style="display: flex; align-items: flex-end; justify-content: space-between">
      <div style="display: flex; flex-direction: column">
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; color: #5A6168">DAY 2 · 10월 4일 토</span>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 60px; line-height: 0.95; font-variant-numeric: tabular-nums">14:20</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 12px; color: #5A6168">
        <span>지금까지 <b style="font-family: 'Barlow Condensed', sans-serif; font-size: 18px; color: #16191D">268</b> km</span>
        <span>남은 거리 144km</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="position: relative; height: 22px">
        <div style="position: absolute; left: 0; right: 0; top: 9px; height: 4px; display: flex; gap: 4px">
          <div style="flex: 3; background: #1F4FD1; border-radius: 2px"></div>
          <div style="flex: 4; background: #D5D9D3; border-radius: 2px; overflow: hidden; display: flex"><div style="width: 46%; background: #1F4FD1"></div></div>
          <div style="flex: 3; background: #D5D9D3; border-radius: 2px"></div>
        </div>
        <div style="position: absolute; left: 50%; top: 2px; width: 18px; height: 18px; margin-left: -9px; border-radius: 9px; background: #E86A10; border: 3px solid #FFFFFF; box-sizing: border-box; box-shadow: 0 0 0 1px #E86A10"></div>
      </div>
      <div style="display: flex; font-family: 'Barlow Condensed', sans-serif; font-size: 14px; color: #5A6168">
        <span style="flex: 3">10.03 강릉</span>
        <span style="flex: 4; color: #16191D; font-weight: 600">10.04 속초</span>
        <span style="flex: 3; text-align: right">10.05 귀가</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: auto">
      <div style="display: flex; align-items: center; gap: 10px">
        <button aria-label="이전 머문 곳" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #D5D9D3; background: #FFFFFF; display: grid; place-items: center; color: #16191D; cursor: pointer">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2v12M13 2.5v11L5 8z" fill="currentColor" stroke="currentColor" stroke-width="1.5"></path></svg>
        </button>
        <button aria-label="{{playLabel}}" onClick="{{togglePlay}}" style="width: 64px; height: 64px; border-radius: 32px; border: none; background: #16191D; display: grid; place-items: center; color: #FFFFFF; cursor: pointer">
          <sc-if value="{{playing}}" hint-placeholder-val="{{ true }}">
            <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="5" y="4" width="4" height="14" rx="1" fill="currentColor"></rect><rect x="13" y="4" width="4" height="14" rx="1" fill="currentColor"></rect></svg>
          </sc-if>
          <sc-if value="{{paused}}" hint-placeholder-val="{{ false }}">
            <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M6 3.5v15L18.5 11z" fill="currentColor"></path></svg>
          </sc-if>
        </button>
        <button aria-label="다음 머문 곳" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #D5D9D3; background: #FFFFFF; display: grid; place-items: center; color: #16191D; cursor: pointer">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M13 2v12M3 2.5v11L11 8z" fill="currentColor" stroke="currentColor" stroke-width="1.5"></path></svg>
        </button>
      </div>
      <div role="group" aria-label="재생 속도" style="display: flex; background: #EEF0EC; border-radius: 12px; padding: 3px; gap: 2px">
        <sc-for list="{{speeds}}" as="s" hint-placeholder-count="3">
          <button onClick="{{s.pick}}" aria-pressed="{{s.pressed}}" style="{{s.style}}">{{s.label}}</button>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { playing: true, speed: '60x' };
  }
  renderVals() {
    const base = "min-width: 44px; height: 38px; border-radius: 9px; border: none; font-family: 'Barlow Condensed', sans-serif; font-size: 17px; font-weight: 600; cursor: pointer; padding: 0 8px;";
    const speeds = ['1x', '10x', '60x'].map((label) => {
      const on = this.state.speed === label;
      return {
        label,
        pressed: on ? 'true' : 'false',
        style: base + (on ? ' background: #FFFFFF; color: #16191D; box-shadow: 0 1px 2px rgba(22,25,29,0.15);' : ' background: transparent; color: #5A6168;'),
        pick: () => this.setState({ speed: label }),
      };
    });
    return {
      speeds,
      playing: this.state.playing,
      paused: !this.state.playing,
      playLabel: this.state.playing ? '일시정지' : '재생',
      togglePlay: () => this.setState({ playing: !this.state.playing }),
    };
  }
}
</script>
</body>
</html>
