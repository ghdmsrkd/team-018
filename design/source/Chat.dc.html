    <span style="font-size: 12px; color: #5A6168">기록이 있는 기간 · <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 14px; color: #16191D">2025.11.14 — 오늘</span></span>
  </div>

  <div style="flex: 1; padding: 18px 16px 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden">

    <div style="display: flex; flex-direction: column; gap: 10px; max-width: 330px">

        <a href="Replay.dc.html" style="height: 44px; border-radius: 12px; background: #1F4FD1; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600; text-decoration: none">

    <button style="flex-shrink: 0; height: 36px; border-radius: 18px; border: 1px solid #C9CEC6; background: #FFFFFF; padding: 0 14px; font: inherit; font-size: 13px; color: #16191D; cursor: pointer">지난달 커피 몇 번 마셨어?</button>
    <button style="flex-shrink: 0; height: 36px; border-radius: 18px; border: 1px solid #C9CEC6; background: #FFFFFF; padding: 0 14px; font: inherit; font-size: 13px; color: #16191D; cursor: pointer">성수 파스타집 어디였지?</button>
  </div>

    <button type="submit" aria-label="보내기" style="width: 48px; height: 48px; border-radius: 24px; border: none; background: #16191D; color: #FFFFFF; display: grid; place-items: center; cursor: pointer">
